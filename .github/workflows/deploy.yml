name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    # the default is 360 min — a stalled apt mirror would hang for hours
    timeout-minutes: 20
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      # ubuntu-24.04 runners no longer ship ImageMagick, and Ubuntu's Azure apt
      # mirror goes unreachable often enough to hang the job for hours. Cap every
      # apt call, and if the package still cannot be installed, fall back to a
      # build without responsive webp variants instead of failing the deploy.
      - name: Install ImageMagick 🖼️
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update || true
            sudo timeout 240 apt-get install -y --no-install-recommends imagemagick || true
          fi
          if command -v convert >/dev/null 2>&1; then
            echo "JEKYLL_CONFIG=_config.yml" >> "$GITHUB_ENV"
          else
            echo "::warning::ImageMagick unavailable (apt mirror down) — building without responsive images"
            echo "JEKYLL_CONFIG=_config.yml,_config_no_imagemagick.yml" >> "$GITHUB_ENV"
          fi
      - name: Install and Build 🔧
        run: |
          pip3 install --upgrade -r requirements.txt
          export JEKYLL_ENV=production
          bundle exec jekyll build --config "$JEKYLL_CONFIG"
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Publish as-is, without a second Jekyll pass 🚫
        run: touch _site/.nojekyll
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
